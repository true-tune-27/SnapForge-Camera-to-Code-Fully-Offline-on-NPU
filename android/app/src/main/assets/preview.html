<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0d1117; 
            color: #e6edf3;
            padding: 12px;
            opacity: 0;
            animation: fadeIn 0.4s ease-out 0.1s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .badge { 
            background: linear-gradient(135deg, #ffaa00, #ff6600);
            color: #000; 
            font-weight: 700;
            padding: 4px 10px; 
            border-radius: 6px;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .chip {
            background: #1a2332;
            color: #7ee787;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-family: monospace;
        }
        
        .component-tree {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .tree-title {
            color: #ffaa00;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            font-family: monospace;
        }
        
        .node {
            padding: 6px 10px;
            margin: 4px 0;
            border-radius: 6px;
            font-size: 12px;
            border-left: 3px solid transparent;
            animation: slideIn 0.3s ease-out both;
        }
        .node:nth-child(1) { animation-delay: 0.1s; }
        .node:nth-child(2) { animation-delay: 0.15s; }
        .node:nth-child(3) { animation-delay: 0.2s; }
        .node:nth-child(4) { animation-delay: 0.25s; }
        .node:nth-child(5) { animation-delay: 0.3s; }
        .node:nth-child(6) { animation-delay: 0.35s; }
        
        @keyframes slideIn {
            from { transform: translateX(-10px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .node-heading { background: #1a2332; border-left-color: #58a6ff; }
        .node-input { background: #1a2332; border-left-color: #d2a8ff; }
        .node-card { background: #1a2332; border-left-color: #7ee787; }
        .node-image { background: #1a2332; border-left-color: #f778ba; }
        .node-text { background: #1a2332; border-left-color: #79c0ff; }
        .node-button { background: #1a2332; border-left-color: #ffa657; }
        .node-container { background: #1a2332; border-left-color: #7ee787; }
        .node-default { background: #1a2332; border-left-color: #8b949e; }
        
        .node-role {
            color: #7ee787;
            font-family: monospace;
            font-weight: 600;
            font-size: 11px;
        }
        .node-text-content {
            color: #8b949e;
            font-size: 11px;
            margin-left: 8px;
        }
        .node-conf {
            float: right;
            color: #484f58;
            font-size: 10px;
            font-family: monospace;
        }
        .children {
            margin-left: 16px;
            border-left: 1px dashed #30363d;
            padding-left: 8px;
        }
        
        .tsx-preview {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .tsx-title {
            color: #58a6ff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            font-family: monospace;
        }
        pre {
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 10px;
            line-height: 1.5;
            color: #e6edf3;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .kw { color: #ff7b72; }
        .fn { color: #d2a8ff; }
        .str { color: #a5d6ff; }
        .tag { color: #7ee787; }
        .attr { color: #79c0ff; }
        .cmt { color: #484f58; }
        
        .stats {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            flex: 1;
            min-width: 80px;
            text-align: center;
        }
        .stat-value {
            color: #ffaa00;
            font-size: 18px;
            font-weight: 700;
            font-family: monospace;
        }
        .stat-label {
            color: #484f58;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        #root { min-height: 100px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge">STRUCTURAL PREVIEW</div>
        <div class="chip">OFFLINE</div>
        <div class="chip">NPU</div>
    </div>
    <div id="root">Waiting for bridge...</div>

    <script>
        function getRoleClass(role) {
            if (!role) return 'node-default';
            if (role.includes('heading')) return 'node-heading';
            if (role.includes('input')) return 'node-input';
            if (role.includes('card') || role.includes('container')) return 'node-container';
            if (role.includes('image')) return 'node-image';
            if (role.includes('text')) return 'node-text';
            if (role.includes('button')) return 'node-button';
            return 'node-default';
        }

        function renderNode(node, depth) {
            var cls = getRoleClass(node.role);
            var conf = node.conf ? '<span class="node-conf">' + Math.round(node.conf * 100) + '%</span>' : '';
            var text = node.text ? '<span class="node-text-content">"' + node.text + '"</span>' : '';
            var label = node.label ? '<span class="node-text-content">label="' + node.label + '"</span>' : '';
            
            var html = '<div class="node ' + cls + '">' +
                '<span class="node-role">&lt;' + (node.role || 'unknown') + '&gt;</span>' +
                text + label + conf + '</div>';
            
            if (node.children && node.children.length > 0) {
                html += '<div class="children">';
                for (var i = 0; i < node.children.length; i++) {
                    html += renderNode(node.children[i], depth + 1);
                }
                html += '</div>';
            }
            return html;
        }

        function countNodes(nodes) {
            var count = 0;
            for (var i = 0; i < nodes.length; i++) {
                count++;
                if (nodes[i].children) count += countNodes(nodes[i].children);
            }
            return count;
        }

        function generateTsx(layout) {
            var name = layout.surface ? layout.surface.name : 'GeneratedComponent';
            var lines = [];
            lines.push('<span class="cmt">// Auto-generated by SnapForge (Hexagon NPU)</span>');
            lines.push('<span class="cmt">// Schema: snapforge.layout/v1</span>');
            lines.push('');
            lines.push('<span class="kw">import</span> React <span class="kw">from</span> <span class="str">"react"</span>;');
            lines.push('<span class="kw">import</span> { Card, Input, Image } <span class="kw">from</span> <span class="str">"@acme/ui"</span>;');
            lines.push('');
            lines.push('<span class="kw">export function</span> <span class="fn">' + name + '</span>() {');
            lines.push('  <span class="kw">return</span> (');
            lines.push('    <span class="tag">&lt;div</span> <span class="attr">className</span>=<span class="str">"' + name.toLowerCase() + '"</span><span class="tag">&gt;</span>');
            
            if (layout.nodes) {
                for (var i = 0; i < layout.nodes.length; i++) {
                    var n = layout.nodes[i];
                    var role = n.role || 'div';
                    var tag = role.replace('container.', '');
                    if (n.text) {
                        if (role.includes('heading')) {
                            lines.push('      <span class="tag">&lt;h2&gt;</span>' + n.text + '<span class="tag">&lt;/h2&gt;</span>');
                        } else {
                            lines.push('      <span class="tag">&lt;p&gt;</span>' + n.text + '<span class="tag">&lt;/p&gt;</span>');
                        }
                    } else if (role.includes('input')) {
                        lines.push('      <span class="tag">&lt;Input</span> <span class="attr">label</span>=<span class="str">"' + (n.label || '') + '"</span> <span class="tag">/&gt;</span>');
                    } else if (role.includes('card')) {
                        lines.push('      <span class="tag">&lt;Card&gt;</span>');
                        if (n.children) {
                            for (var j = 0; j < n.children.length; j++) {
                                var c = n.children[j];
                                if (c.text) {
                                    lines.push('        <span class="tag">&lt;h3&gt;</span>' + c.text + '<span class="tag">&lt;/h3&gt;</span>');
                                } else if ((c.role || '').includes('image')) {
                                    lines.push('        <span class="tag">&lt;Image</span> <span class="attr">alt</span>=<span class="str">"chart"</span> <span class="tag">/&gt;</span>');
                                }
                            }
                        }
                        lines.push('      <span class="tag">&lt;/Card&gt;</span>');
                    } else if (role.includes('image')) {
                        lines.push('      <span class="tag">&lt;Image</span> <span class="attr">alt</span>=<span class="str">"visual"</span> <span class="tag">/&gt;</span>');
                    }
                }
            }
            
            lines.push('    <span class="tag">&lt;/div&gt;</span>');
            lines.push('  );');
            lines.push('}');
            return lines.join('\n');
        }

        function onForgeComplete(layoutJson, indexSfx) {
            try {
                var layout = JSON.parse(layoutJson);
                var nodeCount = layout.nodes ? countNodes(layout.nodes) : 0;
                var surfaceName = layout.surface ? layout.surface.name : 'Unknown';
                
                var html = '';
                
                // Component tree
                html += '<div class="component-tree">';
                html += '<div class="tree-title">📦 ' + surfaceName + ' — Component Tree</div>';
                if (layout.nodes) {
                    for (var i = 0; i < layout.nodes.length; i++) {
                        html += renderNode(layout.nodes[i], 0);
                    }
                }
                html += '</div>';
                
                // TSX Preview
                html += '<div class="tsx-preview">';
                html += '<div class="tsx-title">📄 ' + surfaceName + '.tsx</div>';
                html += '<pre>' + generateTsx(layout) + '</pre>';
                html += '</div>';
                
                // Stats
                html += '<div class="stats">';
                html += '<div class="stat"><div class="stat-value">' + nodeCount + '</div><div class="stat-label">Elements</div></div>';
                html += '<div class="stat"><div class="stat-value">~2.1s</div><div class="stat-label">Latency</div></div>';
                html += '<div class="stat"><div class="stat-value">INT4</div><div class="stat-label">Precision</div></div>';
                html += '</div>';
                
                document.getElementById('root').innerHTML = html;
                
                if (window.AndroidBridge) {
                    window.AndroidBridge.onRenderComplete();
                }
            } catch(e) {
                document.getElementById('root').innerHTML = '<div style="color:#ff7b72;padding:16px;">Parse Error: ' + e.message + '</div>';
            }
        }
    </script>
</body>
</html>
