name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify no INTERNET permission in android/
        run: |
          if grep -r "android.permission.INTERNET" android/ 2>/dev/null; then
            echo "::error::INTERNET permission found in android/ — this violates the offline invariant"
            exit 1
          fi
          echo "✓ No INTERNET permission found in android/"

      - name: Verify GBNF is not stale
        run: |
          if [ -f schema/src/gbnf/compile.ts ]; then
            npm run gbnf --workspace=schema 2>/dev/null || true
            if ! git diff --exit-code schema/gbnf/ 2>/dev/null; then
              echo "::error::Committed GBNF is stale — regenerate with 'npm run gbnf'"
              exit 1
            fi
          fi
          echo "✓ GBNF check passed"
